name: 卡牌规则验证
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 获取固定版本 Godot
        run: |
          curl -fL https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
      - name: 导入资源并验证核心玩法
        run: |
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot --editor --import
          /tmp/godot/Godot_v4.3-stable_linux.x86_64 --headless --path godot res://cruise/tests/test_suite.tscn
