<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡航演练 · 接力改装</title><style>body{margin:0;background:#101a1e;color:#eaf1df;font:16px/1.8 "Microsoft YaHei",sans-serif}main{max-width:860px;margin:auto;padding:60px 24px}small,a{color:#d4eb88}h1{font-size:48px;line-height:1.3}p{color:#a5b8b5}.button{display:inline-block;padding:12px 22px;margin:12px 12px 20px 0;border:1px solid #607147;border-radius:7px;text-decoration:none}.primary{background:#d4eb88;color:#14251d;font-weight:bold}img{width:100%;border:1px solid #34494d;border-radius:10px}footer{margin-top:25px;font-size:12px;color:#a5b8b5}</style></head><body><main><small>系统 / 玩法策划 · 开源改造</small><h1>巡航演练 · 接力改装</h1><p>选出你的三人舰队，用出牌顺序蓄满免费指令。战后打捞专属牌，决定强化谁；首领半血后切换攻击节奏，检验这局的构筑。</p><a class="button primary" href="web/play.html">进入在线试玩 →</a><a class="button" href="https://github.com/wangdi999/cruise-drill/releases/latest">下载离线版</a><a class="button" href="https://github.com/wangdi999/cruise-drill">查看源码</a><p><strong>三人接力</strong>：不同队员轮流出牌，免费齐射、全队护盾或应急补给三选一，蓄能跨回合保留。<br><strong>战后改装</strong>：十二种专属牌，每局三选一；替换两张基础牌，牌组保持十二张。<br><strong>首领过载</strong>：半血后伤害增强、群攻节奏改变，新意图立即显示。</p><img src="artifacts/02-battle.png" alt="实际战斗画面"><footer>基于 Adam Gulacsi 的 Deck Builder Tutorial（MIT）资源层改造。新增代码在 AI 辅助下实现，署名、许可和验证记录见仓库。</footer></main></body></html>
